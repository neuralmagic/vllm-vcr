# compat.toml -- the rolling vLLM support window.
#
# Source of truth for which vLLM lines this repo builds and conforms against.
# The manifest diff *is* the release: adding/removing a [[vllm]] entry or
# flipping `fidelity_validated` advances the window. Parsed by `sim-compat`
# (build.rs stamps the default line's tag as VLLM_TARGET_VERSION + emits the
# per-line capability cfgs; the handshake guard and conformance runner read it).
#
# Rules:
#   - `protocol_rev` is the vllm.git rev whose in-tree `vllm-engine-core-client`
#     this line builds against. vLLM cuts release branches off main, so these are
#     v0.X-era main commits, not the tagged releases; the `tag` is the line label.
#   - `patch_repo`/`patch_rev` (optional, both-or-neither): a fork that
#     `[patch]`-overrides the crate for fixes not yet upstream (a DIFFERENT source
#     than vllm.git). Omit when the line builds against upstream directly. No line
#     in the current window needs one: every supported line builds against
#     upstream, so the repo has no external-fork dependency.
#   - Exactly one line has `default = true`. That line is `:latest` / unsuffixed.
#     It is always the newest stable release.
#   - A line enters with `fidelity_validated = false` and is promoted to `true`
#     only once the conformance replay gates pass against its captures.
#   - Two non-stable "tracker" lines ride ahead of the stable window so wire drift
#     shows up before a release pins us to it. Neither is ever `default`:
#       * `nightly` tracks vLLM main (post-merge commits); its `tag` is the literal
#         `"nightly"`. protocol_rev is bumped to the latest main sha by the canary.
#       * `rc` tracks the newest upstream release candidate newer than the current
#         stable (e.g. `v0.26.1rc0`); both its `tag` and `protocol_rev` are bumped
#         by the release watcher. build.rs parses the rc tag's `major.minor` like
#         any release, so the right capability cfgs turn on.
#     build.rs treats a non-`vX.Y` tag (i.e. `nightly`) as the newest line (all
#     capability cfgs on).
#   - The stable window holds up to three lines (N, N-1, N-2). A new stable
#     release rolls in as the default, demotes the old default, and drops the
#     oldest once the window is full. The `nightly`/`rc` trackers and the stable
#     roll are automated by .github/workflows/vllm-release-watch.yml (build-gated
#     PRs); the manifest stays the source of truth, the watcher just edits it.

[[vllm]]
# Bleeding edge: tracks vLLM main so the build/conformance matrix flags wire drift
# the day a post-merge commit breaks it. protocol_rev is bumped to the latest green
# main sha by the canary's weekly (Monday / on-demand) PR.
# See .github/workflows/nightly-canary.yml.
line = "nightly"
tag = "nightly"
protocol_rev = "53e211d2923192ea1f7442de93d59cfbb150e089"
fidelity_validated = false

[[vllm]]
# Latest upstream release candidate, ahead of the newest stable. Tracked by the
# release watcher (`cargo xtask watch-rc`), which bumps BOTH tag and protocol_rev
# to the highest `vX.Y.ZrcN` tag newer than the default line. fidelity_validated
# stays false (RCs never get goldens).
line = "rc"
tag = "v0.28.0rc2"
protocol_rev = "74a6576b9b5832494c314405c3cae94db55801e1"
fidelity_validated = false

[[vllm]]
# N (head). 0.29 grew the handshake again: `EngineCoreReadyResponse` requires
# `supports_lora` and `max_loras` (the frontend rejects an engine where
# `supports_lora != (max_loras > 0)`), and the client-side
# `decode_engine_core_outputs` now takes `&[Bytes]` instead of any `AsRef<[u8]>`.
# The sim's map-encoded `SimReadyResponse` superset emits the new keys on every
# line, and the tap already holds `Bytes` frames, so neither needed a cfg.
line = "0.29"
tag = "v0.29.0"
protocol_rev = "98dff2a81d747d1dba01a47f939f48c3526d4206"
fidelity_validated = false
default = true

[[vllm]]
# N-1. `EngineId::from_engine_index` narrowed to u16 here (the
# `vllm_engine_id_u16` cfg, on from this line up). Everything else 0.28 added
# is a trailing `#[serde(default)]` field (`EngineCoreRequest.session_id`, the
# `mm_cache_miss_hashes`/`new_sampling_mask` output slots, three optional ready
# response keys), which the tuple decoders tolerate in both directions.
line = "0.28"
tag = "v0.28.0"
protocol_rev = "2cf0a6915ce544dc493a0990f2ea38d81601128a"
fidelity_validated = false

[[vllm]]
# N-2. The oldest line: `EngineId::from_engine_index` still takes u32, so this
# is what keeps the `not(vllm_engine_id_u16)` branch honest. 0.27 frontends
# require the parallel-config sizes, the scheduler caps, `instance_id`, and an
# optional `kv_events_config` in the ready response (all emitted by the
# `SimReadyResponse` superset).
line = "0.27"
tag = "v0.27.1"
protocol_rev = "6e448d0ea9bf3d88d898b65449ca6dc2aec170ac"
fidelity_validated = true
