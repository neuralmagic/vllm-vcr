# Vendored from llm-d v1.0.0 (guides/recipes/router/base.values.yaml). Base EPP
# scheduler + Envoy proxy settings, layered under pd-disaggregation.values.yaml.
# Differs from upstream in two ways: resource requests are halved (this rig serves
# mock engines, not a GPU fleet), and the tracing block is left out (no collector).
# The EPP image is the chart's own pinned default.
router:
  epp:
    replicas: 1
    flags:
      v: 2
    pluginsConfigFile: "default-plugins.yaml"
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http

  proxy:
    proxyType: envoy
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "8"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi
