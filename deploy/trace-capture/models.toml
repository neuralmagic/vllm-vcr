# Conformance capture matrix for gen-capture-jobs.py (one Kueue Job per [[capture]]).
# Targets run via conformance-queue (one GPU at a time). Upload + register: docs/conformance.md.
#
# A target is a model x scenario; the vLLM line comes from `--line` (default: the
# compat.toml default line) and the engine/tap images are derived from that line.
# Each [[capture]] inherits [defaults].
# scenario: baseline | nocache | specdecode | multimodal

[defaults]
namespace = "inference-sim"
queue = "conformance-queue"
gpu = "H200"
gpu_memory_utilization = 0.90
tp = 1
block_size = 16
max_num_seqs = 256
max_model_len = 16384
enforce_eager = true
engine_cpu_request = "8"
engine_cpu_limit = "16"
engine_memory_request = "64Gi"
engine_memory_limit = "96Gi"
model_cache_size = "100Gi"

# The per-line golden set: what the golden-capture workflow captures for a line.
# Three multiturn captures because a lone capture is an anomaly waiting to happen
# (3 of ~10 multiturn captures were anomalous when this was last measured), and
# MIN_FIDELITY_GOLDENS in sim-compat is what makes the line a hard gate.
[goldens]
targets = ["qwen3-8b-mt-s7", "qwen3-8b-mt-s13", "qwen3-8b-nocache-s7"]

[[capture]]
name = "qwen3-8b-mt-s7"
model = "Qwen/Qwen3-8B"
scenario = "baseline"
phases = "multiturn"
mt_seed = "7"
workload = "multiturn-s7"

[[capture]]
name = "qwen3-8b-mt-s13"
model = "Qwen/Qwen3-8B"
scenario = "baseline"
phases = "multiturn"
mt_seed = "13"
workload = "multiturn-s13"

[[capture]]
name = "qwen3-8b-nocache-s7"
model = "Qwen/Qwen3-8B"
scenario = "nocache"
phases = "multiturn"
mt_seed = "7"
workload = "multiturn-nocache-s7"

