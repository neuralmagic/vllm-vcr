# conformance/manifest.toml -- references to golden capture traces.
#
# Golden captures are NOT committed (they are MBs and some carry model token
# content). They live in our private bucket; this manifest pins each one by
# sha256 so CI can fetch and verify it. Parsed by `sim-compat::GoldenManifest`.
#
# One [[golden]] entry per captured trace:
#   line         vLLM line it validates (matches a compat.toml [[vllm]].line)
#   bucket_path  key within the bucket (CI fetches ${CONFORMANCE_BUCKET}/${bucket_path});
#                live under the conformance/ prefix the fetch role is scoped to.
#                Convention: conformance/<vllm_tag>/<gpu>/<model>/<workload>[-seed<N>].jsonl.gz
#                where <vllm_tag> is the release tag (e.g. v0.23.0) or "nightly" (tracks
#                main). gpu and model id (its '/' kept) are path segments. These mirror
#                config_hash inputs (vllm_tag/gpu/model), so captures across builds,
#                hardware, and models don't collide; the hash stays the authoritative
#                replay key, the path is just organization. `line` stays a field below
#                (CI groups by it). CI mirrors the full key under $CONFORMANCE_GOLDENS, so
#                the path (not just the basename) is resolved.
#   sha256       content hash; CI fetches + verifies against this
#   config_hash  deployment-config fingerprint; replay gate uses it as
#                --expect-config-hash so a trace can't replay against the wrong config
#   workload     label, e.g. "sweep" or "multiturn"
#   role         "schema" (cheap structural/handshake conformance) or
#                "fidelity" (tolerance-banded behavioral replay)
#
# The bucket and fetch role live in ci.yml (CONFORMANCE_BUCKET); the role can
# GetObject under the conformance/ prefix only.
#
# Example (uncomment and fill once the first capture is uploaded):
#
# [[golden]]
# line = "0.23"
# bucket_path = "conformance/v0.23.0/H200/Qwen/Qwen3-8B/sweep.jsonl.gz"
# sha256 = "TODO"
# config_hash = "TODO"
# workload = "sweep"
# role = "fidelity"

# The support window's goldens: three per line (two prefix-cached multiturn seeds
# plus one nocache multiturn), Qwen3-8B on H200, tp1, block_size 16, max_num_seqs
# 256, enforce_eager. Captured against each line's released vllm-openai image
# pinned by digest (see deploy/trace-capture/models.toml). Every one replays
# byte-identically, which is what fidelity_validated = true rests on.
#
# The cached and nocache captures sit in different regimes (TTFT p50 ~35 ms vs
# ~500-600 ms) and carry different config_hash values, so a trace cannot be
# replayed against the wrong engine config.

